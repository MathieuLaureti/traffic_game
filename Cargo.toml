[workspace]
resolver = "2"
members = [
    "crates/sim_time",
    "crates/world",
    "crates/agents",
    "crates/pathing",
    "crates/traffic",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bevy = { version = "0.15", default-features = true }